packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  # Its postinstall vendors WASM for the Node entry; the web entry we use is prebuilt.
  '@shotstack/shotstack-canvas': false
  # argon2 needs its install script to fetch/build the native binding.
  argon2: true
  # esbuild ships a prebuilt binary and needs its install script to run (used by Vite).
  esbuild: true
  # Would download an ffmpeg binary; only the canvas package's Node entry wants it.
  ffmpeg-static: false
