# Landing pages (apps/landing). This is a TEMPLATE: the official nginx image
# runs envsubst on /etc/nginx/templates/*.template when the container starts
# (writing /etc/nginx/conf.d/default.conf), so one image serves staging and
# production. ${LANDING_*} are the container's environment, defaults in
# docker/landing.Dockerfile (NGINX_ENVSUBST_FILTER keeps envsubst to them);
# lower-case $names are nginx's own. See docs/landing/fale-com-a-wings.md.
#
#   LANDING_HOSTS       hosts this container serves (commas or spaces); others answer 404
#   LANDING_ROOT_SLUGS  host=slug pairs whose "/" is that page; any other "/" goes to wingscompany.com.br
#   LANDING_API_BASE    the API the form calls, ending in /api (written into the page)
#   LANDING_GTM_ID      the Google Tag Manager container; empty loads no tag
#   LANDING_INDEXABLE   only "true" lets search engines index; anything else is noindex

# 1 when the request's host is in LANDING_HOSTS (exact name, any case).
map "$host ${LANDING_HOSTS} " $landing_known_host {
    default 0;
    "~*^(?<landing_kh>[^ ]+) (?:.*[ ,])?\k<landing_kh>[ ,]" 1;
}

# The slug "/" shows on this host, or "" when LANDING_ROOT_SLUGS names none.
map "$host ${LANDING_ROOT_SLUGS} " $landing_root_slug {
    default "";
    "~*^(?<landing_rh>[^ ]+) (?:.*[ ,])?\k<landing_rh>=(?<landing_rs>[a-z0-9][a-z0-9-]*)[ ,]" $landing_rs;
}

map "${LANDING_INDEXABLE}" $landing_robots {
    default "noindex, nofollow";
    "true" "index, follow";
}

# An empty value sends no header at all.
map "${LANDING_INDEXABLE}" $landing_x_robots {
    default "noindex, nofollow";
    "true" "";
}

# Hashed build files never change; everything else (and any error) is revalidated on each visit.
map "$status $uri" $landing_cache_control {
    default "no-cache";
    "~^200 /assets/" "public, max-age=31536000, immutable";
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    server_tokens off;
    charset utf-8;

    # Every answer carries the same headers: no location below has an
    # add_header of its own, so none of these is dropped there. The CSP leaves
    # script-src open on purpose (Google Tag Manager loads tags from anywhere).
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(self), gyroscope=(self), camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $landing_cache_control always;
    add_header X-Robots-Tag $landing_x_robots always;

    # The page's runtime config, written into its <meta> tags (text/html only).
    set $landing_page_path "/";
    sub_filter_once off;
    sub_filter '__LANDING_API_BASE__' '${LANDING_API_BASE}';
    sub_filter '__LANDING_GTM_ID__' '${LANDING_GTM_ID}';
    sub_filter '__LANDING_ROBOTS__' '$landing_robots';
    sub_filter '__LANDING_ORIGIN__' 'https://$host';
    sub_filter '__LANDING_PAGE_URL__' 'https://$host$landing_page_path';

    # Coolify's health check, on any host.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        if ($landing_known_host = 0) {
            return 404;
        }
        if ($landing_root_slug = "") {
            return 302 https://wingscompany.com.br/;
        }
        rewrite ^ /$landing_root_slug/index.html break;
    }

    # /<slug> and /<slug>/: that page, when the build has it.
    location ~ "^/(?<landing_slug>[a-z0-9][a-z0-9-]{0,79})/?$" {
        if ($landing_known_host = 0) {
            return 404;
        }
        set $landing_page_path "/$landing_slug";
        try_files /$landing_slug/index.html =404;
    }

    location /assets/ {
        if ($landing_known_host = 0) {
            return 404;
        }
        try_files $uri =404;
    }

    location /og/ {
        if ($landing_known_host = 0) {
            return 404;
        }
        try_files $uri =404;
    }

    location / {
        return 404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
