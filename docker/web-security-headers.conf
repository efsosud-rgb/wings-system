# Included at server level and in every location with its own add_header:
# nginx drops the server-level add_header lines in such a location, which is
# how index.html once went out without them.
add_header X-Content-Type-Options "nosniff" always;
# Only this system may show its pages inside a frame (clickjacking). Nothing of
# ours is framed by another site; the API sends the same pair (lib/frame-guard.ts).
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
