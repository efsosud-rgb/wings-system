name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  check:
    # Release stage 1 (30/10/2026): the self-hosted runner setup of #51 and the non-blocking
    # format:check of #32, without the quality-gate steps that need scripts this cut does not have.
    runs-on: [self-hosted, linux, x64, wings]
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wings
          POSTGRES_PASSWORD: wings_ci
          POSTGRES_DB: wings_system
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U wings -d wings_system"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data

    env:
      DATABASE_URL: postgresql://wings:wings_ci@127.0.0.1:5432/wings_system

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint

      # Migrations and seeds must stay runnable from scratch. These run before
      # the tests because the API integration tests create their own throwaway
      # database from DATABASE_URL.
      - run: pnpm --filter @wings/api db:migrate
      - run: pnpm --filter @wings/api db:seed
      # Re-running the seed must be a no-op, not a duplicate-key error.
      - run: pnpm --filter @wings/api db:seed

      # One package at a time: the web timing tests fail under load on the shared runner.
      - run: pnpm -r --workspace-concurrency=1 test

      # Runs last and does not block the job while the general Prettier pass is pending.
      - run: pnpm format:check
        continue-on-error: true
